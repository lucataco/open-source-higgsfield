[project]
name = "body-double"
version = "0.1.0"
description = "Same take. New cast. Open-weights character recasting on local ComfyUI."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "comfy-sdk==0.5.0",
  "comfy-api-proxy==0.1.6",
  "av",
  "numpy",
  "pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bodydouble"]
